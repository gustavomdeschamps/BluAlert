<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="BluAlert - alertas e orientacao da Defesa Civil de Blumenau.">
  <meta name="theme-color" content="#071E2B">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>BluAlert</title>
</head>
<body>
  <script>
    // Remove o service worker legado que mantinha telas antigas do protótipo.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) registration.unregister();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
